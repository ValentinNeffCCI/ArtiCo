<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="860" viewBox="0 0 1080 860" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrowState" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <style>
      .title { font-size: 26px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 14px; fill: #64748b; }
      .box-title { font-size: 16px; font-weight: 700; }
      .box-sub { font-size: 11.5px; font-family: 'Courier New', monospace; }
      .lbl { font-size: 12px; fill: #334155; }
      .lbl-state { font-size: 12px; fill: #7c3aed; font-weight: 600; }
      .small { font-size: 11px; fill: #475569; }
      .tag { font-size: 11px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1080" height="860" fill="#f8fafc"/>
  <text x="40" y="48" class="title">Form Builder — Le Constructeur (Builder)</text>
  <text x="40" y="72" class="subtitle">Frontend React · components/forms/CustomForm/Builder · création &amp; édition d'un formulaire</text>

  <!-- useForm state container -->
  <rect x="40" y="100" width="1000" height="100" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="60" y="128" class="box-title" fill="#7c3aed">État central — hook useForm()</text>
  <text x="60" y="150" class="box-sub" fill="#5b21b6">content = { name, entrepriseId, inputs: [ { id, name, type, required, options[] } ] }</text>
  <text x="60" y="172" class="small">setContent(updater) ← mutations immuables (addField / handleChange / onRemove / addOption / removeOption)</text>
  <text x="60" y="190" class="small">submitForm(e) → query(`/formulaire` ou `/formulaire/{id}`, POST | PUT, content)</text>

  <!-- FormBuilder -->
  <rect x="40" y="240" width="430" height="300" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="60" y="268" class="box-title" fill="#1d4ed8">FormBuilder.jsx</text>
  <text x="60" y="288" class="small">Conteneur &amp; orchestrateur. Détient l'état via useForm.</text>

  <rect x="60" y="302" width="390" height="26" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="72" y="319" class="lbl">input « Nom du formulaire » → changeListener</text>

  <rect x="60" y="334" width="390" height="74" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="72" y="353" class="lbl" font-weight="600">fields.map(input → &lt;InputBuilder/&gt;)</text>
  <text x="72" y="372" class="small">props: onChange, onDelete, onOpenDialog, onRemoveOption</text>
  <text x="72" y="392" class="small">isEdit = Boolean(form?.id) → préremplit depuis form.inputs</text>

  <rect x="60" y="416" width="185" height="30" rx="6" fill="#bfdbfe" stroke="#60a5fa"/>
  <text x="72" y="435" class="lbl">+ Ajouter un champ → addField</text>
  <rect x="255" y="416" width="195" height="30" rx="6" fill="#bbf7d0" stroke="#22c55e"/>
  <text x="267" y="435" class="lbl">Enregistrer → handleSubmit</text>

  <rect x="60" y="454" width="390" height="70" rx="6" fill="#fef9c3" stroke="#eab308"/>
  <text x="72" y="473" class="lbl" font-weight="600">handleSubmit — validation</text>
  <text x="72" y="491" class="small">select/radio/checkbox sans option → toast.error (bloque)</text>
  <text x="72" y="509" class="small">sinon submitForm() → toast succès + onSuccess / reset</text>

  <!-- InputBuilder -->
  <rect x="510" y="240" width="530" height="360" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="530" y="268" class="box-title" fill="#b45309">InputBuilder.jsx — un champ</text>
  <text x="530" y="288" class="small">État local datas (copie du champ) · onglet courant</text>

  <!-- tabs -->
  <rect x="530" y="300" width="160" height="28" rx="6" fill="#fde68a" stroke="#d97706"/>
  <text x="545" y="319" class="lbl">Onglet 0 · Général</text>
  <rect x="700" y="300" width="160" height="28" rx="6" fill="#fde68a" stroke="#d97706"/>
  <text x="715" y="319" class="lbl">Onglet 1 · Options*</text>
  <rect x="870" y="300" width="150" height="28" rx="6" fill="#fde68a" stroke="#d97706"/>
  <text x="885" y="319" class="lbl">Onglet 2 · Aperçu</text>
  <text x="700" y="344" class="small">* affiché uniquement si type ∈ {select, radio, checkbox}</text>

  <!-- onglet général -->
  <rect x="530" y="356" width="490" height="70" rx="6" fill="#ffffff" stroke="#fbbf24"/>
  <text x="542" y="375" class="lbl" font-weight="600">Général : Nom · Type (types.js) · Obligatoire (oui/non)</text>
  <text x="542" y="394" class="small">handleChange → onChange(newValue, input.id) remonte au parent</text>
  <text x="542" y="413" class="small">"Retirer" → onDelete(input.id)</text>

  <!-- onglet options -->
  <rect x="530" y="434" width="240" height="90" rx="6" fill="#ffffff" stroke="#fbbf24"/>
  <text x="542" y="453" class="lbl" font-weight="600">Options</text>
  <text x="542" y="471" class="small">liste &lt;OptionBuilder/&gt;</text>
  <text x="542" y="488" class="small">supprimer → onRemoveOption(id)</text>
  <text x="542" y="506" class="small">"Ajouter un choix" → onOpenDialog</text>

  <!-- onglet apercu -->
  <rect x="780" y="434" width="240" height="90" rx="6" fill="#ffffff" stroke="#fbbf24"/>
  <text x="792" y="453" class="lbl" font-weight="600">Aperçu — preview()</text>
  <text x="792" y="471" class="small">switch(type) → rend le champ</text>
  <text x="792" y="488" class="small">réutilise &lt;CustomInput/&gt;</text>
  <text x="792" y="506" class="small">+ &lt;ColorInput/&gt; (type color)</text>

  <!-- reuse note -->
  <rect x="530" y="538" width="490" height="48" rx="6" fill="#ecfeff" stroke="#06b6d4"/>
  <text x="542" y="558" class="small" fill="#0e7490" font-weight="600">↩ Réutilisation du Displayer :</text>
  <text x="542" y="576" class="small" fill="#0e7490">l'onglet Aperçu instancie CustomInput (du dossier Displayer) → même rendu que côté réponse.</text>

  <!-- Dialog -->
  <rect x="40" y="600" width="430" height="120" rx="12" fill="#fae8ff" stroke="#a21caf" stroke-width="2"/>
  <text x="60" y="628" class="box-title" fill="#86198f">LocalOptionDialog</text>
  <text x="60" y="649" class="small">Modale d'ajout d'option (intitulé du choix)</text>
  <text x="60" y="669" class="box-sub" fill="#86198f">addOption({ id: uuid, value }, inputId)</text>
  <text x="60" y="691" class="small">onClose → ferme · setShowDialog stocke l'inputId ciblé</text>
  <text x="60" y="710" class="small">déclenché par onOpenDialog depuis InputBuilder</text>

  <!-- OptionBuilder -->
  <rect x="510" y="616" width="270" height="84" rx="12" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/>
  <text x="530" y="644" class="box-title" fill="#be123c" font-size="15">OptionBuilder.jsx</text>
  <text x="530" y="664" class="small">Affiche une option { value }</text>
  <text x="530" y="684" class="small">bouton − → onDelete(option.id)</text>

  <!-- types.js -->
  <rect x="800" y="616" width="240" height="84" rx="12" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="820" y="644" class="box-title" fill="#4338ca" font-size="15">types.js</text>
  <text x="820" y="664" class="small">11 types de champ disponibles</text>
  <text x="820" y="684" class="small">text, textarea, number, email,</text>

  <!-- Backend -->
  <rect x="300" y="760" width="480" height="64" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="320" y="788" class="box-title" fill="#15803d">API Backend</text>
  <text x="320" y="809" class="box-sub" fill="#15803d">POST /formulaire  |  PUT /formulaire/{id}   (persistance)</text>

  <!-- ARROWS -->
  <!-- state to formbuilder -->
  <path d="M150 200 L150 240" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#arrowState)"/>
  <text x="158" y="226" class="lbl-state">content / setContent</text>

  <!-- formbuilder map to inputbuilder -->
  <path d="M470 371 L510 371" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="448" y="362" class="small" text-anchor="middle">map()</text>

  <!-- inputbuilder onChange back to state -->
  <path d="M690 240 C 690 170, 360 150, 200 200" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#arrowState)" opacity="0.85"/>
  <text x="690" y="232" class="lbl-state" text-anchor="middle">onChange / onDelete ↑</text>

  <!-- inputbuilder to dialog -->
  <path d="M530 506 C 470 540, 430 560, 360 600" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="455" y="556" class="small" text-anchor="middle">onOpenDialog</text>

  <!-- dialog to state (addOption) -->
  <path d="M120 600 C 90 420, 95 300, 110 200" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#arrowState)"/>
  <text x="86" y="400" class="lbl-state" transform="rotate(-90 86 400)" text-anchor="middle">addOption ↑</text>

  <!-- options tab to optionbuilder -->
  <path d="M650 524 L650 616" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="658" y="572" class="small">render</text>

  <!-- general tab to types -->
  <path d="M900 426 C 910 520, 915 560, 918 616" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="924" y="540" class="small">types</text>

  <!-- submit to backend -->
  <path d="M352 524 C 360 640, 470 720, 520 760" stroke="#16a34a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="430" y="700" class="small" fill="#15803d" font-weight="600">submitForm()</text>

  <!-- legend -->
  <rect x="40" y="836" width="14" height="14" fill="#f5f3ff" stroke="#7c3aed" stroke-dasharray="3 2"/>
  <text x="60" y="848" class="small">— flux d'état (useForm)</text>
  <rect x="240" y="836" width="14" height="14" fill="#fff" stroke="#475569"/>
  <text x="260" y="848" class="small">— appel / rendu de composant</text>
  <rect x="500" y="836" width="14" height="14" fill="#dcfce7" stroke="#16a34a"/>
  <text x="520" y="848" class="small">— persistance API</text>
</svg>
