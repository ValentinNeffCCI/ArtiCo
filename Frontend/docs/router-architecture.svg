<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1000" viewBox="0 0 1180 1000" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <style>
      .title { font-size: 26px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 13px; fill: #64748b; }
      .box-label { font-size: 13px; font-weight: 700; }
      .box-sub { font-size: 11px; }
      .route { font-size: 11px; font-family: 'Consolas','Monaco',monospace; }
      .badge { font-size: 10px; font-weight: 700; }
      .legend { font-size: 12px; fill: #334155; }
      .note { font-size: 11px; fill: #475569; }
      .edge { stroke: #94a3b8; stroke-width: 1.6; fill: none; }
    </style>
  </defs>

  <rect width="1180" height="1000" fill="#f8fafc"/>

  <!-- Header -->
  <text x="40" y="46" class="title">Router &amp; Layouts — ArtiCo Frontend</text>
  <text x="40" y="68" class="subtitle">react-router-dom · createBrowserRouter · src/route/router.jsx</text>

  <!-- Root router -->
  <rect x="470" y="92" width="240" height="48" rx="10" fill="#1e293b"/>
  <text x="590" y="113" text-anchor="middle" class="box-label" fill="#fff">createBrowserRouter</text>
  <text x="590" y="130" text-anchor="middle" class="box-sub" fill="#cbd5e1">4 branches racines</text>

  <!-- Distribution lines from root -->
  <path class="edge" d="M590,140 L590,160 M180,160 L1000,160" />
  <path class="edge" d="M180,160 L180,184" marker-end="url(#arrow)"/>
  <path class="edge" d="M590,160 L590,184" marker-end="url(#arrow)"/>
  <path class="edge" d="M850,160 L850,184" marker-end="url(#arrow)"/>
  <path class="edge" d="M1010,160 L1010,184" marker-end="url(#arrow)"/>

  <!-- ============ MainLayout branch ============ -->
  <rect x="40" y="186" width="500" height="470" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/>
  <rect x="40" y="186" width="500" height="56" rx="14" fill="#3b82f6"/>
  <rect x="40" y="220" width="500" height="22" fill="#3b82f6"/>
  <text x="58" y="212" class="box-label" fill="#fff">&lt;MainLayout /&gt;</text>
  <text x="58" y="232" class="box-sub" fill="#dbeafe">Header · &lt;PositionProvider&gt;&lt;Outlet/&gt; · Footer · ToastContainer</text>

  <!-- children = VisitorRoutes -->
  <text x="58" y="266" class="box-sub" fill="#1e40af" font-weight="700">children = VisitorRoutes (public)</text>

  <!-- Public routes -->
  <g>
    <rect x="58" y="276" width="220" height="20" rx="5" fill="#fff" stroke="#bfdbfe"/>
    <text x="66" y="290" class="route" fill="#1e3a8a">/</text>
    <text x="120" y="290" class="box-sub" fill="#64748b">Accueil</text>
    <rect x="58" y="300" width="220" height="20" rx="5" fill="#fff" stroke="#bfdbfe"/>
    <text x="66" y="314" class="route" fill="#1e3a8a">/rechercher</text>
    <rect x="58" y="324" width="220" height="20" rx="5" fill="#fff" stroke="#bfdbfe"/>
    <text x="66" y="338" class="route" fill="#1e3a8a">/artisan/:id</text>
    <rect x="58" y="348" width="220" height="20" rx="5" fill="#fff" stroke="#bfdbfe"/>
    <text x="66" y="362" class="route" fill="#1e3a8a">/questionnaire/:id</text>
    <rect x="58" y="372" width="220" height="20" rx="5" fill="#fff" stroke="#bfdbfe"/>
    <text x="66" y="386" class="route" fill="#1e3a8a">/mot-de-passe-oublie</text>
    <rect x="58" y="396" width="220" height="20" rx="5" fill="#fff" stroke="#bfdbfe"/>
    <text x="66" y="410" class="route" fill="#1e3a8a">/reinitialiser-mot-de-passe</text>
    <rect x="58" y="420" width="220" height="20" rx="5" fill="#fff" stroke="#bfdbfe"/>
    <text x="66" y="434" class="route" fill="#1e3a8a">/mentions-legales</text>
    <rect x="58" y="444" width="220" height="20" rx="5" fill="#fff" stroke="#bfdbfe"/>
    <text x="66" y="458" class="route" fill="#1e3a8a">/politique-de-* (2)</text>
  </g>

  <!-- ProtectedRoute USER/ADMIN nested -->
  <rect x="294" y="276" width="232" height="188" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="5 3"/>
  <rect x="302" y="284" width="120" height="18" rx="9" fill="#16a34a"/>
  <text x="312" y="297" class="badge" fill="#fff">ProtectedRoute</text>
  <text x="430" y="297" class="badge" fill="#15803d">USER · ADMIN</text>
  <text x="302" y="320" class="box-sub" fill="#15803d" font-weight="700">children = userRoutes</text>

  <rect x="302" y="328" width="216" height="18" rx="5" fill="#fff" stroke="#bbf7d0"/>
  <text x="310" y="341" class="route" fill="#14532d">/profil</text>
  <rect x="302" y="350" width="216" height="18" rx="5" fill="#fff" stroke="#bbf7d0"/>
  <text x="310" y="363" class="route" fill="#14532d">/entreprise/:id</text>
  <rect x="302" y="372" width="216" height="18" rx="5" fill="#fff" stroke="#bbf7d0"/>
  <text x="310" y="385" class="route" fill="#14532d">/entreprise/:id/formulaires</text>
  <rect x="302" y="394" width="216" height="18" rx="5" fill="#fff" stroke="#bbf7d0"/>
  <text x="310" y="407" class="route" fill="#14532d">/formulaire/modifier/:id</text>
  <rect x="302" y="416" width="216" height="18" rx="5" fill="#fff" stroke="#bbf7d0"/>
  <text x="310" y="429" class="route" fill="#14532d">/formulaire/:id/reponses</text>

  <!-- nested USER-only -->
  <rect x="302" y="438" width="216" height="20" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.2" stroke-dasharray="4 2"/>
  <text x="310" y="452" class="route" fill="#9a3412">/entreprise/nouveau</text>
  <text x="470" y="452" class="badge" fill="#c2410c">USER</text>

  <!-- ============ AdminLayout branch ============ -->
  <rect x="560" y="186" width="320" height="320" rx="14" fill="#faf5ff" stroke="#9333ea" stroke-width="1.6"/>
  <rect x="560" y="186" width="320" height="56" rx="14" fill="#9333ea"/>
  <rect x="560" y="220" width="320" height="22" fill="#9333ea"/>
  <text x="578" y="212" class="box-label" fill="#fff">&lt;AdminLayout /&gt;</text>
  <text x="578" y="232" class="box-sub" fill="#f3e8ff">AdminSidebar · &lt;Outlet/&gt; · ToastContainer</text>

  <!-- ProtectedRoute ADMIN -->
  <rect x="578" y="262" width="284" height="226" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="5 3"/>
  <rect x="586" y="270" width="120" height="18" rx="9" fill="#16a34a"/>
  <text x="596" y="283" class="badge" fill="#fff">ProtectedRoute</text>
  <text x="800" y="283" class="badge" fill="#15803d">ADMIN</text>
  <text x="586" y="306" class="box-sub" fill="#15803d" font-weight="700">children = adminRoutes</text>

  <rect x="586" y="314" width="268" height="22" rx="6" fill="#fff" stroke="#bbf7d0"/>
  <text x="594" y="329" class="route" fill="#14532d">/admin</text>
  <text x="700" y="329" class="box-sub" fill="#64748b">Dashboard</text>
  <rect x="586" y="340" width="268" height="22" rx="6" fill="#fff" stroke="#bbf7d0"/>
  <text x="594" y="355" class="route" fill="#14532d">/admin/users</text>
  <rect x="586" y="366" width="268" height="22" rx="6" fill="#fff" stroke="#bbf7d0"/>
  <text x="594" y="381" class="route" fill="#14532d">/admin/entreprises</text>
  <rect x="586" y="392" width="268" height="22" rx="6" fill="#fff" stroke="#bbf7d0"/>
  <text x="594" y="407" class="route" fill="#14532d">/admin/categories</text>

  <!-- ============ Standalone routes ============ -->
  <rect x="900" y="186" width="240" height="100" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
  <text x="918" y="210" class="box-label" fill="#334155">Sans layout</text>
  <rect x="918" y="222" width="204" height="22" rx="6" fill="#fff" stroke="#cbd5e1"/>
  <text x="926" y="237" class="route" fill="#334155">/connexion</text>
  <text x="1030" y="237" class="box-sub" fill="#64748b">Login</text>
  <rect x="918" y="250" width="204" height="22" rx="6" fill="#fff" stroke="#cbd5e1"/>
  <text x="926" y="265" class="route" fill="#334155">*</text>
  <text x="1030" y="265" class="box-sub" fill="#64748b">NotFound</text>

  <!-- ============ ProtectedRoute logic ============ -->
  <rect x="900" y="320" width="240" height="336" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="920" y="346" class="box-label" fill="#15803d">ProtectedRoute — logique</text>
  <text x="920" y="366" class="note" fill="#475569">src/components/security/</text>

  <!-- flow steps -->
  <rect x="920" y="380" width="200" height="34" rx="8" fill="#fff" stroke="#86efac"/>
  <text x="930" y="395" class="box-sub" fill="#14532d" font-weight="700">loading ?</text>
  <text x="930" y="408" class="box-sub" fill="#64748b">→ return null (attente auth)</text>

  <rect x="920" y="424" width="200" height="34" rx="8" fill="#fff" stroke="#86efac"/>
  <text x="930" y="439" class="box-sub" fill="#14532d" font-weight="700">!user ?</text>
  <text x="930" y="452" class="box-sub" fill="#dc2626">→ &lt;Navigate to="/" /&gt;</text>

  <rect x="920" y="468" width="200" height="48" rx="8" fill="#fff" stroke="#86efac"/>
  <text x="930" y="483" class="box-sub" fill="#14532d" font-weight="700">role ∉ allowedRoles ?</text>
  <text x="930" y="496" class="box-sub" fill="#dc2626">→ &lt;Navigate to="/" /&gt;</text>
  <text x="930" y="509" class="box-sub" fill="#64748b">(useAuth → UserContext)</text>

  <rect x="920" y="526" width="200" height="34" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="930" y="541" class="box-sub" fill="#15803d" font-weight="700">✓ autorisé</text>
  <text x="930" y="554" class="box-sub" fill="#64748b">→ &lt;Outlet /&gt; (rend l'enfant)</text>

  <!-- vertical flow arrows -->
  <path class="edge" d="M1020,414 L1020,424" marker-end="url(#arrow)"/>
  <path class="edge" d="M1020,458 L1020,468" marker-end="url(#arrow)"/>
  <path class="edge" d="M1020,516 L1020,526" marker-end="url(#arrow)"/>

  <!-- ============ Legend ============ -->
  <rect x="40" y="688" width="1100" height="120" rx="12" fill="#fff" stroke="#e2e8f0"/>
  <text x="60" y="714" class="box-label" fill="#0f172a">Légende &amp; principe</text>

  <rect x="60" y="728" width="22" height="14" rx="3" fill="#3b82f6"/>
  <text x="90" y="740" class="legend">Layout — encadre les pages via &lt;Outlet/&gt; (UI persistante : header, sidebar…)</text>

  <rect x="60" y="752" width="22" height="14" rx="3" fill="#9333ea"/>
  <text x="90" y="764" class="legend">AdminLayout — interface admin avec sidebar dédiée</text>

  <rect x="60" y="776" width="22" height="14" rx="3" fill="#16a34a" stroke="#16a34a" stroke-dasharray="3 2"/>
  <text x="90" y="788" class="legend">ProtectedRoute — garde d'accès par rôle (route imbriquée, pas de layout propre)</text>

  <rect x="620" y="728" width="22" height="14" rx="3" fill="#fff7ed" stroke="#ea580c" stroke-dasharray="3 2"/>
  <text x="650" y="740" class="legend">Garde imbriquée USER — restriction supplémentaire à l'intérieur d'une zone protégée</text>

  <rect x="620" y="752" width="22" height="14" rx="3" fill="#f1f5f9" stroke="#64748b"/>
  <text x="650" y="764" class="legend">Routes sans layout — Login &amp; NotFound rendus directement</text>

  <text x="620" y="788" class="note">Imbrication : Router → Layout (&lt;Outlet/&gt;) → ProtectedRoute (&lt;Outlet/&gt;) → Page</text>

  <!-- Flow strip -->
  <rect x="40" y="824" width="1100" height="120" rx="12" fill="#0f172a"/>
  <text x="60" y="852" class="box-label" fill="#fff">Cycle de rendu d'une URL protégée</text>
  <g transform="translate(60,872)">
    <rect x="0" y="0" width="150" height="40" rx="8" fill="#1e293b"/>
    <text x="75" y="18" text-anchor="middle" class="box-sub" fill="#cbd5e1">URL demandée</text>
    <text x="75" y="32" text-anchor="middle" class="route" fill="#93c5fd">/entreprise/:id</text>

    <path class="edge" stroke="#475569" d="M150,20 L190,20" marker-end="url(#arrow)"/>
    <rect x="192" y="0" width="150" height="40" rx="8" fill="#1e3a8a"/>
    <text x="267" y="18" text-anchor="middle" class="box-sub" fill="#fff">MainLayout</text>
    <text x="267" y="32" text-anchor="middle" class="box-sub" fill="#bfdbfe">Header/Footer + Outlet</text>

    <path class="edge" stroke="#475569" d="M342,20 L382,20" marker-end="url(#arrow)"/>
    <rect x="384" y="0" width="170" height="40" rx="8" fill="#14532d"/>
    <text x="469" y="18" text-anchor="middle" class="box-sub" fill="#fff">ProtectedRoute</text>
    <text x="469" y="32" text-anchor="middle" class="box-sub" fill="#bbf7d0">vérifie user + rôle</text>

    <path class="edge" stroke="#475569" d="M554,20 L594,20" marker-end="url(#arrow)"/>
    <rect x="596" y="0" width="150" height="40" rx="8" fill="#166534"/>
    <text x="671" y="18" text-anchor="middle" class="box-sub" fill="#fff">Page rendue</text>
    <text x="671" y="32" text-anchor="middle" class="box-sub" fill="#bbf7d0">via &lt;Outlet/&gt;</text>

    <path class="edge" stroke="#dc2626" stroke-dasharray="4 3" d="M469,40 L469,58 L900,58 L900,40" />
    <rect x="820" y="0" width="160" height="40" rx="8" fill="#7f1d1d"/>
    <text x="900" y="18" text-anchor="middle" class="box-sub" fill="#fff">Non autorisé</text>
    <text x="900" y="32" text-anchor="middle" class="box-sub" fill="#fecaca">Navigate → /</text>
  </g>
</svg>
